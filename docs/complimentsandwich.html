<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliment Sandwich</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #bce4e5;
        }
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .input-section {
            background: #c55347;
            border: 3px solid #000;
            border-top: 10px solid #000;
            font-size: 0.9rem;
            padding: .8rem 1.2rem;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.4rem;
            border: 2px solid #000;
            font-family: inherit;
            font-size: .9rem;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #000;
        }

        button {
            width: 100%;
            background: #000;
            color: white;
            border: none;
            padding: 0.75rem;
            cursor: pointer;
            font-size: .75rem;
            font-weight: 600;
            font-family: inherit;
        }

        button:hover {
            background: #333;
        }

        .output-section {
            background: #b59392;
            border: 3px solid #000;
            border-bottom: 10px solid #000;
            padding: 1.5rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sandwich {
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: center;
        }

        #sandwich:empty::before {
            content: "Your compliment sandwich will appear here...";
            font-style: italic;
            color: #666;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #000;
        }

        .back-link a:hover {
            background: #000;
            color: #bce4e5;
        }
    </style>
</head>
<body>
    <div class="container">
            <h1>Compliment Sandwich</h1>
            <p>Sandwich a criticism with two random compliments.</p>

        <div class="input-section">
            <div class="form-group">
                <label for="criticism">Enter a criticism</label>
                <input type="text" id="criticism" placeholder="you could be more punctual">
            </div>
            <button onclick="printSandwich()">Create Sandwich</button>
        </div>

        <div class="output-section">
            <p id="sandwich"></p>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script src="js/compliment-sandwich.js"></script>
</body>
</html>
