<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean don't Lai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="grid">
            <!-- Interactive box with onclick -->
            <div class="box interactive" id="birthday-box" onclick="checkBirthday()">
                <h2>is it Sean's birthday?</h2>
            </div>

            <!-- Another interactive box -->
            <div class="box interactive" id="flip-box" onclick="flipCoin()">
                <h2>flip a coin</h2>
            </div>

            <!-- Link boxes to other pages -->
            <a href="/energy.html" class="box">
                <h2>layman's energies</h2>
                <p>Energy unit converter</p>
            </a>

            <a href="/entropy.html" class="box">
                <h2>entropy</h2>
                <p>Particle visualization</p>
            </a>
            
            <!-- Box with embedded content -->
            <div class="box">
                <h2 id="crane-toggle" onclick="toggleVideo()" style="cursor: pointer;">A Crane Flies</h2>
                <iframe 
                    id="crane" 
                    class="hidden"
                    width="100%" 
                    height="200"
                    src="https://www.youtube.com/embed/EIdwXzBoeAs" 
                    frameborder="0" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
