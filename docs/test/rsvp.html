<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night RSVP</title>
    <link rel="stylesheet" href="style.css">
    <style>

        /* Container - narrower than index */
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .event-info {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        /* Form Section */
        .form-section {
            background: #a1a39a;
            border: 3px solid #000;
            border-left: 10px solid #000;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #000;
            font-family: inherit;
            font-size: 1rem;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #000;
        }

        button {
            width: 100%;
            background: #000;
            color: white;
            border: 3px solid #000;
            padding: 0.75rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        /* Attendee Section */
        .attendee-section {
            margin-top: 2rem;
        }

        .attendee-count {
            text-align: center;
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        /* Grid for attendee boxes */
        .attendee-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        /* Individual attendee box */
        .attendee-box {
            background: #a1a39a;
            border: 2px solid #000;
            border-left: 6px solid #000;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: left;
        }

        /* Messages */
        .message {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 2px solid #000;
            font-weight: 600;
            text-align: center;
        }

        .success {
            background: #90ee90;
        }

        .error {
            background: #ffcccb;
        }

        .loading {
            text-align: center;
            padding: 1rem;
            font-style: italic;
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #000;
        }

        .back-link a:hover {
            background: #000;
            color: #d8a37b;
        }

        /* Responsive - single column on mobile */
        @media (max-width: 768px) {
            .attendee-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Movie Night 🎬</h1>
        
        <div class="event-info">
            <p><strong>Friday, 7:00 PM</strong></p>
            <p>Studio Theatre</p>
            <p>Movie TBD (vote in person!)</p>
        </div>

        <!-- RSVP Form -->
        <div class="form-section">
            <div id="message"></div>
            
            <form id="rsvp-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="Enter your name">
                </div>
                
                <button type="submit" id="submit-btn">Add Me to the List</button>
            </form>
        </div>

        <!-- Attendee List -->
        <div class="attendee-section">
            <div class="attendee-count" id="count">Loading...</div>
            <div id="attendees-container">
                <div class="loading">Loading attendees...</div>
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        // Currently using localStorage for demo
        // Set to true and configure when ready to use Google Sheets
        const USE_REAL_BACKEND = true;
        const API_URL = 'https://script.google.com/macros/s/AKfycbz8JJwD1AVtsCJS35oQMshsUTMRuNBr3KVi4Iy1gY4NpIwx10Z3coU0TXx3OJJagpyE/exec';

        const form = document.getElementById('rsvp-form');
        const nameInput = document.getElementById('name');
        const messageDiv = document.getElementById('message');
        const attendeesContainer = document.getElementById('attendees-container');
        const countDiv = document.getElementById('count');
        const submitBtn = document.getElementById('submit-btn');

        // Load attendees on page load
        loadAttendees();

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            
            if (!name) return;
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Adding...';
            
            try {
                await addAttendee(name);
                showMessage('You\'re on the list!', 'success');
                form.reset();
                await loadAttendees();
            } catch (error) {
                showMessage('Oops! Something went wrong. Try again?', 'error');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Me to the List';
            }
        });

        async function addAttendee(name) {
    if (USE_REAL_BACKEND) {
        // Real backend (Google Sheets)
        await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',  // ADD THIS LINE
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                timestamp: new Date().toISOString()
            })
        });
        
        // With no-cors, we can't check response, so just return success
        return { success: true };
    } else {
        // LocalStorage demo stays the same
        const attendees = getLocalAttendees();
        
        if (attendees.some(a => a.name.toLowerCase() === name.toLowerCase())) {
            throw new Error('Name already on list');
        }
        
        attendees.push({
            name: name,
            timestamp: new Date().toISOString()
        });
        
        localStorage.setItem('rsvps', JSON.stringify(attendees));
        return { success: true };
    }
}

        async function loadAttendees() {
            try {
                let attendees;
                
                if (USE_REAL_BACKEND) {
                    // Real backend
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Failed to load attendees');
                    attendees = await response.json();
                } else {
                    // LocalStorage demo
                    attendees = getLocalAttendees();
                }
                
                displayAttendees(attendees);
            } catch (error) {
                attendeesContainer.innerHTML = '<div class="error">Failed to load attendees</div>';
                console.error(error);
            }
        }

        function getLocalAttendees() {
            const stored = localStorage.getItem('rsvps');
            return stored ? JSON.parse(stored) : [];
        }

        function displayAttendees(attendees) {
            const count = attendees.length;
            countDiv.textContent = `${count} ${count === 1 ? 'person' : 'people'} coming`;
            
            if (count === 0) {
                attendeesContainer.innerHTML = '<div class="loading">Be the first to RSVP!</div>';
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'attendee-grid';
            
            attendees.forEach(attendee => {
                const box = document.createElement('div');
                box.className = 'attendee-box';
                box.textContent = escapeHtml(attendee.name);
                grid.appendChild(box);
            });
            
            attendeesContainer.innerHTML = '';
            attendeesContainer.appendChild(grid);
        }

        function showMessage(text, type) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            
            setTimeout(() => {
                messageDiv.className = '';
                messageDiv.textContent = '';
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
