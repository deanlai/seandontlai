<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Nights</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Grid of event boxes */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        /* Event box */
        .event-box {
            background: #a1a39a;
            border: 3px solid #000;
            border-left: 10px solid #000;
            padding: 1.5rem;
            min-height: 150px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .event-box:hover {
            background: #e8ebde;
        }

        .event-info {
            flex-grow: 1;
        }

        .event-box h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .event-box .date {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .event-box .movie {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .event-box .attendee-count {
            font-size: 0.8rem;
            color: #333;
            margin-top: 1rem;
            padding-top: 0.5rem;
            border-top: 2px solid #000;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-style: italic;
        }

        .error {
            background: #ffcccb;
            border: 2px solid #000;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
        }

        .no-events {
            text-align: center;
            padding: 3rem;
            font-style: italic;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #000;
        }

        .back-link a:hover {
            background: #000;
            color: #d8a37b;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upcoming Movie Nights 🎬</h1>
        
        <div id="events-container">
            <div class="loading">Loading events...</div>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwHHs7Qnum8ooRVRHNXjQYMdtIvCeZBYnfNqbiuAfyoeHsXQwQsxBJYTy3GFiciqZ2f/exec';

        // Load events on page load
        loadEvents();

        async function loadEvents() {
            const container = document.getElementById('events-container');
            
            try {
                const response = await fetch(`${API_URL}?action=getEvents`);
                if (!response.ok) throw new Error('Failed to load events');
                
                const events = await response.json();
                
                if (events.length === 0) {
                    container.innerHTML = '<div class="no-events">No upcoming events scheduled yet.</div>';
                    return;
                }
                
                displayEvents(events);
            } catch (error) {
                container.innerHTML = '<div class="error">Failed to load events. Please try again later.</div>';
                console.error(error);
            }
        }

        function displayEvents(events) {
            const container = document.getElementById('events-container');
            
            const grid = document.createElement('div');
            grid.className = 'events-grid';
            
            events.forEach(event => {
                const box = document.createElement('a');
                box.className = 'event-box';
                box.href = `rsvp-event.html?id=${event.event_id}`;
                
                const info = document.createElement('div');
                info.className = 'event-info';
                
                const title = document.createElement('h2');
                title.textContent = 'Movie Night';
                
                const date = document.createElement('div');
                date.className = 'date';
                date.textContent = event.date;
                
                const movie = document.createElement('div');
                movie.className = 'movie';
                movie.textContent = event.movie || 'Movie TBD';
                
                info.appendChild(title);
                info.appendChild(date);
                info.appendChild(movie);
                
                const count = document.createElement('div');
                count.className = 'attendee-count';
                const attendeeText = event.attendee_count === 1 ? 'person' : 'people';
                count.textContent = `${event.attendee_count} ${attendeeText} coming`;
                
                box.appendChild(info);
                box.appendChild(count);
                grid.appendChild(box);
            });
            
            container.innerHTML = '';
            container.appendChild(grid);
        }
    </script>
</body>
</html>
