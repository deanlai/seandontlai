<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .admin-section {
            background: #a1a39a;
            border: 3px solid #000;
            border-left: 10px solid #000;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .admin-section h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #000;
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #000;
        }

        button {
            width: 100%;
            background: #000;
            color: white;
            border: 3px solid #000;
            padding: 0.75rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            margin-top: 0.5rem;
        }

        button:hover {
            background: #333;
        }

        button.danger {
            background: #8b0000;
            border-color: #8b0000;
        }

        button.danger:hover {
            background: #a52a2a;
        }

        .message {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 2px solid #000;
            font-weight: 600;
            text-align: center;
        }

        .success {
            background: #90ee90;
        }

        .error {
            background: #ffcccb;
        }

        .info {
            background: #add8e6;
        }

        .stats {
            font-size: 0.9rem;
            margin-top: 1rem;
            padding: 0.75rem;
            background: white;
            border: 2px solid #000;
        }

        .stats p {
            margin-bottom: 0.5rem;
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #000;
        }

        .back-link a:hover {
            background: #000;
            color: #d8a37b;
        }

        .hidden {
            display: none;
        }

        .login-form {
            max-width: 400px;
            margin: 4rem auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="login-section" class="admin-section login-form">
            <h1>RSVP Admin Login</h1>
            <div id="login-message"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter admin password">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- Admin Panel (hidden until logged in) -->
        <div id="admin-panel" class="hidden">
            <h1>RSVP Admin Panel</h1>

            <!-- Event Details Section -->
            <div class="admin-section">
                <h2>Update Event Details</h2>
                <div id="event-message"></div>
                <form id="event-form">
                    <div class="form-group">
                        <label for="event-date">Date & Time</label>
                        <input type="text" id="event-date" placeholder="Friday, March 15, 7:00 PM">
                    </div>
                    
                    <div class="form-group">
                        <label for="event-location">Location</label>
                        <input type="text" id="event-location" placeholder="Studio Theatre">
                    </div>
                    
                    <div class="form-group">
                        <label for="event-movie">Movie</label>
                        <input type="text" id="event-movie" placeholder="Movie TBD or actual movie name">
                    </div>
                    
                    <button type="submit">Save Event Details</button>
                </form>
                
                <div class="stats">
                    <p><strong>Note:</strong> Currently these need to be manually updated in rsvp.html</p>
                    <p>Future version can auto-update from here!</p>
                </div>
            </div>

            <!-- Attendee Management -->
            <div class="admin-section">
                <h2>Manage Attendees</h2>
                <div id="attendee-message"></div>
                
                <div class="stats" id="attendee-stats">
                    <p><strong>Total RSVPs:</strong> <span id="total-count">0</span></p>
                    <p><strong>Last updated:</strong> <span id="last-updated">Never</span></p>
                </div>
                
                <button onclick="viewAttendees()">View All Attendees</button>
                <button class="danger" onclick="clearAttendees()">Clear All Attendees</button>
                
                <div id="attendee-list" class="stats hidden" style="margin-top: 1rem; max-height: 300px; overflow-y: auto;">
                    <!-- List will populate here -->
                </div>
            </div>

            <div class="back-link">
                <a href="rsvp.html">← View RSVP Page</a>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const ADMIN_PASSWORD = 'movienight2025'; // Change this!
        const USE_REAL_BACKEND = true; // Match rsvp.html setting
        const API_URL = 'https://script.google.com/macros/s/AKfycbzkSc9i23CHNfRsaDUFwVVZ9tVyXHW3mqTP2aWdO6P_5qVsoaJX_8oIy2s4rg4mP-8R/exec';

        // Check if already logged in
        const isLoggedIn = sessionStorage.getItem('adminLoggedIn') === 'true';
        if (isLoggedIn) {
            showAdminPanel();
        }

        // Login form handler
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                showAdminPanel();
                showLoginMessage('Login successful!', 'success');
            } else {
                showLoginMessage('Incorrect password', 'error');
            }
        });

        function showAdminPanel() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            loadStats();
        }

        function showLoginMessage(text, type) {
            const messageDiv = document.getElementById('login-message');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            setTimeout(() => {
                messageDiv.className = '';
                messageDiv.textContent = '';
            }, 3000);
        }

        function showMessage(elementId, text, type) {
            const messageDiv = document.getElementById(elementId);
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            setTimeout(() => {
                messageDiv.className = '';
                messageDiv.textContent = '';
            }, 5000);
        }

        // Load attendee stats
        async function loadStats() {
            try {
                const attendees = await getAttendees();
                document.getElementById('total-count').textContent = attendees.length;
                document.getElementById('last-updated').textContent = new Date().toLocaleString();
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // View all attendees
        async function viewAttendees() {
            const listDiv = document.getElementById('attendee-list');
            
            try {
                const attendees = await getAttendees();
                
                if (attendees.length === 0) {
                    listDiv.innerHTML = '<p>No attendees yet.</p>';
                } else {
                    let html = '<p><strong>Attendees:</strong></p><ul style="margin-left: 1rem;">';
                    attendees.forEach((attendee, index) => {
                        html += `<li>${index + 1}. ${escapeHtml(attendee.name)}</li>`;
                    });
                    html += '</ul>';
                    listDiv.innerHTML = html;
                }
                
                listDiv.classList.remove('hidden');
            } catch (error) {
                showMessage('attendee-message', 'Error loading attendees', 'error');
            }
        }

        // Clear all attendees
        async function clearAttendees() {
            if (!confirm('Are you sure you want to clear ALL attendees? This cannot be undone!')) {
                return;
            }
            
            try {
                if (USE_REAL_BACKEND) {
                    // For Google Sheets, you'd need to add a delete endpoint
                    showMessage('attendee-message', 'Clear function needs to be implemented for Google Sheets', 'info');
                } else {
                    // Clear localStorage
                    localStorage.removeItem('rsvps');
                    showMessage('attendee-message', 'All attendees cleared!', 'success');
                    loadStats();
                    document.getElementById('attendee-list').classList.add('hidden');
                }
            } catch (error) {
                showMessage('attendee-message', 'Error clearing attendees', 'error');
            }
        }

        // Get attendees
        async function getAttendees() {
            if (USE_REAL_BACKEND) {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to load attendees');
                return await response.json();
            } else {
                const stored = localStorage.getItem('rsvps');
                return stored ? JSON.parse(stored) : [];
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event form handler (for future use)
        document.getElementById('event-form').addEventListener('submit', (e) => {
            e.preventDefault();
            showMessage('event-message', 'Event details saved! (Manual update still required in rsvp.html)', 'info');
        });
    </script>
</body>
</html>
