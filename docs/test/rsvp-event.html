<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night RSVP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Hide content until theme loads */
        body:not(.theme-loaded) #content {
            opacity: 0;
        }

        body.theme-loaded #content {
            opacity: 1;
            transition: opacity 0.3s;
        }
        /* Container - narrower than index */
        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Event header */
        .event-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .event-header h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .event-header .date {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .event-header .location {
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .event-header .description {
            font-size: 0.9rem;
            font-style: italic;
        }

        /* Form Section */
        .form-section {
            background: #a1a39a;
            border: 3px solid #000;
            border-left: 10px solid #000;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.5rem;
            border: 2px solid #000;
            font-family: inherit;
            font-size: 1rem;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #000;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        button {
            background: #000;
            color: white;
            border: 3px solid #000;
            padding: 0.75rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        button.remove-btn {
            background: #8b0000;
            border-color: #8b0000;
        }

        button.remove-btn:hover {
            background: #a52a2a;
        }

        /* Attendee Section */
        .attendee-section {
            margin-top: 2rem;
        }

        .attendee-count {
            text-align: center;
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        /* Grid for attendee boxes */
        .attendee-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        /* Individual attendee box */
        .attendee-box {
            background: #a1a39a;
            border: 2px solid #000;
            border-left: 6px solid #000;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: left;
        }

        /* Messages */
        .message {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 2px solid #000;
            font-weight: 600;
            text-align: center;
        }

        .success {
            background: #90ee90;
        }

        .error {
            background: #ffcccb;
        }

        .info {
            background: #add8e6;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-style: italic;
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #000;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 2px solid #000;
        }

        .back-link a:hover {
            background: #000;
            color: #d8a37b;
        }

        /* Responsive - single column on mobile */
        @media (max-width: 768px) {
            .attendee-grid {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="loading">Loading event...</div>
        </div>

        <div class="back-link">
            <a href="rsvp.html">← Back to Events</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwHHs7Qnum8ooRVRHNXjQYMdtIvCeZBYnfNqbiuAfyoeHsXQwQsxBJYTy3GFiciqZ2f/exec';
        
        let currentEventId = null;
        let currentTheme = 'default';

        // Get event ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        if (!eventId) {
            document.getElementById('content').innerHTML = '<div class="error">No event specified</div>';
        } else {
            currentEventId = eventId;
            loadEvent();
        }

        async function loadEvent() {
            const container = document.getElementById('content');
            
            try {
                // POST request to trigger the script
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'getEvent',
                        event_id: currentEventId
                    })
                });
                
                // Wait a moment
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // GET request to read data
                const response = await fetch(`${API_URL}?action=getEvent&event_id=${currentEventId}`);
                const event = await response.json();
                
                if (event.error) {
                    container.innerHTML = `<div class="error">${event.error}</div>`;
                    return;
                }
                
                // Apply theme
                currentTheme = event.theme || 'default';
                document.body.className = currentTheme;
                document.body.classList.add('theme-loaded');
                
                displayEvent(event);
            } catch (error) {
                container.innerHTML = '<div class="error">Failed to load event. Please try again later.</div>';
                console.error(error);
            }
        }

        function displayEvent(event) {
            const container = document.getElementById('content');
            
            container.innerHTML = `
                <div class="event-header">
                    <h1>${escapeHtml(event.movie || 'Movie Night')}</h1>
                    <div class="date">${escapeHtml(event.date)}</div>
                    <div class="location">${escapeHtml(event.location)}</div>
                    ${event.description ? `<div class="description">${event.description}</div>` : ''}
                </div>

                <!-- RSVP Form -->
                <div class="form-section">
                    <div id="message"></div>
                    
                    <form id="rsvp-form">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" required placeholder="Enter your name">
                        </div>
                        
                        <div class="button-group">
                            <button type="submit" id="add-btn" data-action="add">Add Me to the List</button>
                            <button type="button" id="remove-btn" class="remove-btn" data-action="remove">Remove Me from the List</button>
                        </div>
                    </form>
                </div>

                <!-- Attendee List -->
                <div class="attendee-section">
                    <div class="attendee-count" id="count">${event.attendees.length} ${event.attendees.length === 1 ? 'person' : 'people'} coming</div>
                    <div id="attendees-container"></div>
                </div>
            `;
            
            displayAttendees(event.attendees);
            setupFormHandlers();
        }

        function displayAttendees(attendees) {
            const container = document.getElementById('attendees-container');
            
            if (attendees.length === 0) {
                container.innerHTML = '<div class="loading">Be the first to RSVP!</div>';
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'attendee-grid';
            
            attendees.forEach(attendee => {
                const box = document.createElement('div');
                box.className = 'attendee-box';
                box.textContent = escapeHtml(attendee.name);
                grid.appendChild(box);
            });
            
            container.innerHTML = '';
            container.appendChild(grid);
        }

        function setupFormHandlers() {
            const form = document.getElementById('rsvp-form');
            const addBtn = document.getElementById('add-btn');
            const removeBtn = document.getElementById('remove-btn');
            const nameInput = document.getElementById('name');
            const messageDiv = document.getElementById('message');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                messageDiv.className = '';
                messageDiv.textContent = '';
                await handleAction('add');
            });

            removeBtn.addEventListener('click', async () => {
                messageDiv.className = '';
                messageDiv.textContent = '';
                await handleAction('remove');
            });

            async function handleAction(action) {
                const name = nameInput.value.trim();
                
                if (!name) return;
                
                addBtn.disabled = true;
                removeBtn.disabled = true;
                
                if (action === 'add') {
                    addBtn.textContent = 'Adding...';
                    
                    try {
                        // Check for duplicates first
                        const response = await fetch(`${API_URL}?action=getAttendees&event_id=${currentEventId}`);
                        const attendees = await response.json();
                        const duplicate = attendees.find(a => a.name.toLowerCase() === name.toLowerCase());
                        
                        if (duplicate) {
                            showMessage('That name is already on the list! If this is you, you\'re all set. If you share a name with someone else, please add a last initial (e.g., "Sean L.")', 'info');
                            addBtn.textContent = 'Add Me to the List';
                            addBtn.disabled = false;
                            removeBtn.disabled = false;
                            return;
                        }
                        
                        await addAttendee(name);
                        showMessage('You\'re on the list!', 'success');
                        form.reset();
                        await loadEvent();
                    } catch (error) {
                        showMessage('Oops! Something went wrong. Try again?', 'error');
                        console.error(error);
                    }
                    
                    addBtn.textContent = 'Add Me to the List';
                } else {
                    removeBtn.textContent = 'Removing...';
                    
                    try {
                        const result = await removeAttendee(name);
                        
                        if (result.deleted) {
                            showMessage('You\'ve been removed from the list.', 'success');
                            form.reset();
                            await loadEvent();
                        } else {
                            showMessage('Name not found. Make sure you typed it exactly as it appears in the list.', 'error');
                        }
                    } catch (error) {
                        showMessage('Oops! Something went wrong. Try again?', 'error');
                        console.error(error);
                    }
                    
                    removeBtn.textContent = 'Remove Me from the List';
                }
                
                addBtn.disabled = false;
                removeBtn.disabled = false;
            }

            function showMessage(text, type) {
                messageDiv.className = `message ${type}`;
                messageDiv.textContent = text;
            }
        }

        async function addAttendee(name) {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'add',
                    event_id: currentEventId,
                    name: name
                })
            });
            
            // Wait for it to process
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            return { success: true };
        }

        async function removeAttendee(name) {
            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'delete',
                    event_id: currentEventId,
                    name: name
                })
            });
            
            // Wait and check if it was deleted
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            const response = await fetch(`${API_URL}?action=getAttendees&event_id=${currentEventId}`);
            const attendees = await response.json();
            const stillThere = attendees.find(a => a.name.toLowerCase() === name.toLowerCase());
            
            return { deleted: !stillThere };
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
